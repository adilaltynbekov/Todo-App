<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Todo app</title>

    <link rel="stylesheet" href="css/style.css" />

    <script src="scripts/script.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <!-- Header container -->
      <div class="header__wrapper container-center">
        <h1 class="header__heading">TODO</h1>

        <!-- Switch theme button -->
        <button
          class="header__theme-switch-btn"
          type="button"
          aria-label="Switch theme dark/light"
        >
          <img
            class="header__btn-icon header__btn-icon--sun"
            src="images/icon-sun.svg"
            alt=""
          />
          <img
            class="header__btn-icon header__btn-icon--moon"
            src="images/icon-moon.svg"
            alt=""
          />
        </button>
      </div>
    </header>

    <main>
      <div class="app__wrapper container-center">
        <!--Todo input container -->
        <form
          id="app__todo-form"
          class="app__todo-form"
          aria-label="Create a new todo"
        >
          <span class="todo__checkbox-custom" aria-hidden="true"></span>
          <input
            id="app__todo-input"
            class="app__todo-input"
            aria-label="Create a new todo"
            type="text"
            placeholder="Create a new todo..."
          />
        </form>

        <!-- Todo stack container -->
        <div class="app__todo-stack-wrapper">
          <!-- Stack list -->
          <ul class="app__todo-list">
            <li class="app__todo">
              <label class="todo__label">
                <input type="checkbox" class="todo__input" />
                <span class="todo__checkbox-custom">
                  <img
                    src="./images/icon-check.svg"
                    alt=""
                    class="todo__check-icon"
                  />
                </span>
              </label>
              <span class="todo__task"
                >Complete this Frontend Mentor Challenge</span
              >
              <button
                class="todo__btn--remove"
                type="button"
                aria-label="Remove task"
              >
                <img
                  class="todo__icon--cross"
                  src="./images/icon-cross.svg"
                  alt=""
                />
              </button>
            </li>

            <li class="app__todo">
              <label class="todo__label">
                <input type="checkbox" class="todo__input" />
                <span class="todo__checkbox-custom">
                  <img
                    src="./images/icon-check.svg"
                    alt=""
                    class="todo__check-icon"
                  />
                </span>
              </label>
              <span class="todo__task"
                >Finish 100 days of code challenge 🚀</span
              >
              <button
                class="todo__btn--remove"
                type="button"
                aria-label="Remove task"
              >
                <img
                  class="todo__icon--cross"
                  src="./images/icon-cross.svg"
                  alt=""
                />
              </button>
            </li>

            <li class="app__todo todo-completed">
              <label class="todo__label">
                <input type="checkbox" class="todo__input" />
                <span class="todo__checkbox-custom">
                  <img
                    src="./images/icon-check.svg"
                    alt=""
                    class="todo__check-icon"
                  />
                </span>
              </label>
              <span class="todo__task"
                >Finish day 17 of 100 days of code challenge 🚀</span
              >
              <button
                class="todo__btn--remove"
                type="button"
                aria-label="Remove task"
              >
                <img
                  class="todo__icon--cross"
                  src="./images/icon-cross.svg"
                  alt=""
                />
              </button>
            </li>
          </ul>

          <!-- Todo stack info -->
          <div class="app__todo-controls">
            <span class="app__items-left">0 items left</span>
            <div class="app__filters">
              <button class="app__filter-btn active-filter" type="button">
                All
              </button>
              <button class="app__filter-btn" type="button">Active</button>
              <button class="app__filter-btn" type="button">Completed</button>
            </div>
            <button class="app__clear-completed-btn" type="button">
              Clear Completed
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer__wrapper container-center">
        <span class="footer__reminder">Drag and drop to reorder list</span>
      </div>
    </footer>
  </body>
</html>
